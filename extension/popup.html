<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>千牛趋势提报助手</title>
  <style>
    :root {
      color-scheme: light;
      --canvas: #fafafa;
      --ink: #0a0a0a;
      --muted: #52525b;
      --line: #e4e4e7;
      --accent: #6d28d9;
      --wash: #f3effe;
    }

    * { box-sizing: border-box; }
    body {
      width: 360px;
      margin: 0;
      padding: 20px;
      background: var(--canvas);
      color: var(--ink);
      font: 13px/1.55 Inter, "Noto Sans SC", "Microsoft YaHei UI", system-ui, sans-serif;
    }

    header { display: flex; align-items: center; gap: 10px; }
    h1 {
      margin: 0;
      font: 700 19px/1.2 "Noto Serif SC", "Songti SC", SimSun, serif;
      letter-spacing: -.025em;
    }

    #status {
      margin: 12px 0 17px;
      padding: 8px 10px;
      border-left: 2px solid #d4d4d8;
      background: #f4f4f5;
      color: var(--muted);
      overflow-wrap: anywhere;
    }

    button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .actions { display: flex; gap: 8px; margin-top: 16px; }
    button {
      min-height: 36px;
      flex: 1;
      padding: 6px 9px;
      border: 1px solid #dcdce0;
      border-radius: 4px;
      background: white;
      color: var(--ink);
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }

    button[hidden] { display: none; }
    button:enabled:hover { border-color: var(--muted); }
    #start { background: var(--accent); border-color: var(--accent); color: white; }
    #start:enabled:hover { background: #5b21b6; border-color: #5b21b6; }
    button:disabled, #start:disabled {
      background: #f4f4f5;
      border-color: var(--line);
      color: #71717a;
      cursor: default;
    }

    .hint { margin: 8px 0 0; color: var(--muted); font-size: 12px; }
    pre {
      margin: 14px 0 0;
      padding-top: 10px;
      border-top: 1px solid var(--line);
      max-height: 176px;
      overflow: auto;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      color: var(--muted);
      font: 12px/1.6 "IBM Plex Mono", Consolas, "Microsoft YaHei UI", monospace;
    }

    pre:empty { display: none; }
  </style>
</head>
<body>
  <header>
    <img src="icons/plane-32.png" alt="" width="28" height="28">
    <h1>千牛趋势提报助手</h1>
  </header>
  <p id="status" role="status">正在检查当前页面…</p>
  <div class="actions">
    <button id="start" disabled>趋势提报</button>
    <button id="market-all" disabled>市场趋势 · 全量提报</button>
    <button id="resume" hidden>继续</button>
    <button id="stop" disabled hidden>停止</button>
  </div>
  <p class="hint">全量提报只运行市场趋势，会提交页面允许勾选的商品。</p>
  <pre id="log" aria-label="运行记录"></pre>
  <script src="popup.js"></script>
</body>
</html>
